<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Discovery App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="">LOGO</div>
        <p>Food Discovery App</p>
        <button>❤️Favorite</button>
    </header>

    <main>
        <form>
            <input type="text" id="searchInput" placeholder="search">
            <button type="submit">Search</button>
        </form>

        <section class="grid" id="main">
            <article class="article">
            <h2>Main Data</h2>
            <img src="">
            <p>Name</p>
            <p>cuisine</p>
            <p>difficulty</p>
            <p>Rate</p>
            </article>
        </section>

        <section class="grid" id="favorite">
            <article class="article">
            <h2>Favorite</h2>
            <img src="">
            <p>Name</p>
            <p>cuisine</p>
            <p>difficulty</p>
            <p>Rate</p>
            <button class="favorite-btn">🤍</button>
            </article>
        </section>

    </main>
    
</body>
</html>
